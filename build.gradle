plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Java エージェント（MOD とは別の jar。起動オプション -javaagent で読ませる。Minecraft・Forge には依存しない）。全体の地図は docs/SPEC_JAVA_AGENTS_DEFENSIVE.md
//   守る側（このMOD の担当）: observer（観察・改ざん防止）、lifeguard（真ライフ）、valkyrieprotect（戦術兵姫の保護）。共通部品は agentcommon
//   Eprotect+ とフラグ辞書のエージェント（src/eprotectplus）は Antigravity の担当
sourceSets {
    observer
    eprotectplus
    // 守る側のエージェントの共通部品（このMOD 同士の再変換の見分け・ログ・いちばん外側に保つ係。JDK だけ）。各エージェントの jar に同梱する
    agentcommon
    // LifeGuard: 保護対象の生死の getter を他のエージェントの偽装より外側で実際の値に直す。lifeguardhooks はブートストラップに置く呼び出し先（JDK だけ）
    lifeguardhooks
    lifeguard
    // オートマタヴァルキリー protect（戦術兵姫だけを守る）。valkyrieprotecthooks はブートストラップに置く呼び出し先（JDK だけ）
    valkyrieprotecthooks
    valkyrieprotect
}
configurations {
    lifeguardAsm
    // run/mods に置いて読ませる検証用 MOD（クラスパスに載せると動かない物。-PwithSuperSteve）
    devMods
}
dependencies {
    observerImplementation sourceSets.agentcommon.output
    lifeguardImplementation sourceSets.agentcommon.output
    lifeguardImplementation sourceSets.lifeguardhooks.output
    lifeguardImplementation 'org.ow2.asm:asm:9.8'
    lifeguardAsm 'org.ow2.asm:asm:9.8'
    valkyrieprotectImplementation sourceSets.agentcommon.output
    valkyrieprotectImplementation sourceSets.valkyrieprotecthooks.output
    valkyrieprotectImplementation 'org.ow2.asm:asm:9.8'
}

/**
 * 守る側のエージェントの jar を作るタスクを登録する。共通部品（agentcommon）を同梱し、asm なら ASM も同梱する。
 * hooks を渡すと、そのブートストラップ用の jar（同じフォルダに置く）を Boot-Class-Path に書き、先に作る
 */
def defensiveAgentJar = { String taskName, String fileSuffix, SourceSet set, String agentClass, String desc, boolean asm, String hooksTask, String hooksSuffix ->
    tasks.register(taskName, Jar) {
        group = 'build'
        description = desc
        if (hooksTask != null) dependsOn hooksTask
        from set.output
        from sourceSets.agentcommon.output
        // ASM を同梱する（エージェントはシステムのクラスローダーで動き、ゲームの ASM は見えないことがある）
        if (asm) from({ configurations.lifeguardAsm.collect { zipTree(it) } }) { exclude 'META-INF/**', 'module-info.class' }
        archiveFileName = "${mod_id}-${fileSuffix}.jar"
        def attrs = [
                'Premain-Class'          : agentClass,
                'Agent-Class'            : agentClass,
                'Can-Retransform-Classes': 'true',
                'Can-Redefine-Classes'   : 'false',
                'Implementation-Version' : mod_version
        ]
        // 呼び出し先はブートストラップへ（vanilla の Entity / LivingEntity からも見えるように）。同じフォルダの jar
        if (hooksSuffix != null) attrs['Boot-Class-Path'] = "${mod_id}-${hooksSuffix}.jar"
        manifest { attributes(attrs) }
    }
    return layout.buildDirectory.file("libs/${mod_id}-${fileSuffix}.jar")
}
def hooksJar = { String taskName, String fileSuffix, SourceSet set, String desc ->
    tasks.register(taskName, Jar) {
        group = 'build'
        description = desc
        from set.output
        archiveFileName = "${mod_id}-${fileSuffix}.jar"
    }
}
hooksJar('lifeguardHooksJar', 'lifeguard-hooks', sourceSets.lifeguardhooks, 'Builds the LifeGuard bootstrap hooks')
hooksJar('valkyrieProtectHooksJar', 'valkyrie-protect-hooks', sourceSets.valkyrieprotecthooks, 'Builds the Automata Valkyrie Protect bootstrap hooks')
def observerJarFile = defensiveAgentJar('observerJar', 'observer', sourceSets.observer,
        'com.automatavalkyries.observer.ObserverAgent', 'Builds the observation Java agent', false, null, null)
def lifeguardJarFile = defensiveAgentJar('lifeguardJar', 'lifeguard', sourceSets.lifeguard,
        'com.automatavalkyries.lifeguard.LifeGuardAgent', 'Builds the LifeGuard Java agent', true, 'lifeguardHooksJar', 'lifeguard-hooks')
def valkyrieProtectJarFile = defensiveAgentJar('valkyrieProtectJar', 'valkyrie-protect', sourceSets.valkyrieprotect,
        'com.automatavalkyries.valkyrieprotect.ValkyrieProtectAgent', 'Builds the Automata Valkyrie Protect Java agent', true, 'valkyrieProtectHooksJar', 'valkyrie-protect-hooks')
// MOD の jar に入れて、設定で（起動の引数なしに）読み込めるようにするエージェント（jar の名前の "<mod_id>-" の後ろ。protect/AgentSelfAttach。2026-10-09）。
// CODEX は自分の担当の所で bundledAgents += [...] と tasks.named('jar') { mustRunAfter ... } を足す（docs/HANDOFF_AGENT_CONFIG_FOR_CODEX.md）
ext.bundledAgents = ['observer', 'lifeguard', 'lifeguard-hooks', 'valkyrie-protect', 'valkyrie-protect-hooks']
def eprotectPlusJarFile = layout.buildDirectory.file("libs/${mod_id}-eprotect-plus.jar")
tasks.register('eprotectPlusJar', Jar) {
    group = 'build'
    description = 'Builds the Eprotect+ Java agent'
    from sourceSets.eprotectplus.output
    exclude 'com/automatavalkyries/eprotectplus/flag/FlagDictionaryInstalled.class'
    from(sourceSets.agentcommon.output) { include 'com/automatavalkyries/agentcommon/Attacher.class' }
    from(sourceSets.main.resources) { include 'automata_valkyries/flag_dictionary.json' }
    archiveFileName = "${mod_id}-eprotect-plus.jar"
    manifest {
        attributes([
                'Premain-Class'          : 'com.automatavalkyries.eprotectplus.EprotectPlusAgent',
                'Agent-Class'            : 'com.automatavalkyries.eprotectplus.EprotectPlusAgent',
                'Can-Retransform-Classes': 'true',
                'Can-Redefine-Classes'   : 'true',
                'Implementation-Version' : mod_version
        ])
    }
}
def flagDictionaryJarFile = layout.buildDirectory.file("libs/${mod_id}-flag-agent.jar")
tasks.register('flagDictionaryAgentJar', Jar) {
    group = 'build'
    description = 'Builds the Flag Dictionary protection Java agent'
    from sourceSets.eprotectplus.output
    exclude 'com/automatavalkyries/eprotectplus/EprotectPlusInstalled.class'
    from(sourceSets.agentcommon.output) { include 'com/automatavalkyries/agentcommon/Attacher.class' }
    from(sourceSets.main.resources) { include 'automata_valkyries/flag_dictionary.json' }
    archiveFileName = "${mod_id}-flag-agent.jar"
    manifest {
        attributes([
                'Premain-Class'          : 'com.automatavalkyries.eprotectplus.flag.FlagDictionaryAgent',
                'Agent-Class'            : 'com.automatavalkyries.eprotectplus.flag.FlagDictionaryAgent',
                'Can-Retransform-Classes': 'true',
                'Can-Redefine-Classes'   : 'true',
                'Implementation-Version' : mod_version
        ])
    }
}
// CODEX-owned agents use the existing config-driven attachment extension.
bundledAgents += ['eprotect-plus', 'flag-agent']
tasks.named('jar') { mustRunAfter 'eprotectPlusJar', 'flagDictionaryAgentJar' }
tasks.named('assemble') {
    dependsOn 'valkyrieProtectJar'
    dependsOn 'lifeguardJar'
    dependsOn 'observerJar'
    dependsOn 'eprotectPlusJar'
    dependsOn 'flagDictionaryAgentJar'
}
// 検証用 MOD を run/mods に置く（dev- で始まる物だけ入れ替える。フラグを外せば消える）
tasks.register('syncDevMods') {
    group = 'verification'
    def modsDir = project.file('run/mods')
    doLast {
        modsDir.mkdirs()
        project.fileTree(modsDir) { include 'dev-*.jar' }.each { it.delete() }
        configurations.devMods.resolvedConfiguration.resolvedArtifacts.each { a ->
            project.copy {
                from a.file
                into modsDir
                rename { "dev-${a.file.name}" }
            }
        }
    }
}
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer'] }.configureEach { dependsOn 'syncDevMods' }
// 守る側のエージェント: フラグを付けて起動するときは先に jar を作る
['withObserver': 'observerJar', 'withLifeGuard': 'lifeguardJar', 'withValkyrieProtect': 'valkyrieProtectJar'].each { flag, jarTask ->
    if (project.hasProperty(flag)) {
        tasks.matching { it.name.startsWith('prepareRun') || it.name in ['runClient', 'runServer', 'runGameTestServer'] }
                .configureEach { dependsOn jarTask }
    }
}
if (project.hasProperty('withEprotectPlus') || project.hasProperty('withAllAgents') || project.hasProperty('withAllKillMods')) {
    tasks.matching { it.name.startsWith('prepareRun') || it.name in ['runClient', 'runServer', 'runGameTestServer'] }
            .configureEach { dependsOn 'eprotectPlusJar' }
}
if (project.hasProperty('withFlagAgent') || project.hasProperty('withEprotectPlus') || project.hasProperty('withAllAgents') || project.hasProperty('withAllKillMods')) {
    tasks.matching { it.name.startsWith('prepareRun') || it.name in ['runClient', 'runServer', 'runGameTestServer'] }
            .configureEach { dependsOn 'flagDictionaryAgentJar' }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // 他の MOD の Mixin の refmap（SRG 名）を開発環境の名前へ読み替える（MDK の既定と同じ。Moonlight Lib などが開発環境で動くように）
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // -PgenericOnly（runGameTestServer / runClient）: MOD ごとの個別対策を切り、準汎用の層だけでどこまで守れるかを測る
            if (project.hasProperty('genericOnly')) property 'automata_valkyries.genericOnly', 'true'

            // -PdisableMixins=compat.HyperlinkMixins,...: このMODの Mixin を名前で外して起動する（干渉の切り分け用。mixin/AutomataMixinPlugin）
            if (project.hasProperty('disableMixins')) property 'automata_valkyries.disableMixins', project.property('disableMixins')

            // 守る側の Java エージェント（docs/SPEC_JAVA_AGENTS_DEFENSIVE.md）。観察者をいちばん先に付ける
            // （このMOD のクラスの「読み込んだときの形」を、ほかのエージェントが手を入れる前に覚えるため）
            //   -PwithObserver: 観察（クラスの書き換えを見張る・このMOD のクラスの改ざんを戻す）
            //   -PwithLifeGuard: 真ライフ（保護対象の生死の getter を実際の値に直す）
            //   -PwithValkyrieProtect: オートマタヴァルキリー protect（戦術兵姫の消去・即死を断る）
            if (project.hasProperty('withObserver')) jvmArg "-javaagent:${observerJarFile.get().asFile.absolutePath}"
            if (project.hasProperty('withLifeGuard')) jvmArg "-javaagent:${lifeguardJarFile.get().asFile.absolutePath}"
            if (project.hasProperty('withValkyrieProtect')) jvmArg "-javaagent:${valkyrieProtectJarFile.get().asFile.absolutePath}"

            // -PwithEprotectPlus / -PwithAllAgents / -PwithAllKillMods: Eprotect+ 高度防御・調査・迂回・真抹殺 Java エージェントを付けて起動する
            def passiveCodeAgents = project.hasProperty('withMadness') || project.hasProperty('passiveAgents')
            if (project.hasProperty('agentCollisionLimit')) {
                jvmArg "-Dautomata_valkyries.agentCollisionLimit=${project.property('agentCollisionLimit')}"
            }
            if (project.hasProperty('withEprotectPlus') || project.hasProperty('withAllAgents') || project.hasProperty('withAllKillMods')) {
                jvmArg "-javaagent:${eprotectPlusJarFile.get().asFile.absolutePath}${passiveCodeAgents ? '=passive' : ''}"
            }

            // -PwithFlagAgent / -PwithEprotectPlus / -PwithAllAgents / -PwithAllKillMods: フラグ辞書防護 Java エージェントを付けて起動する
            if (project.hasProperty('withFlagAgent') || project.hasProperty('withEprotectPlus') || project.hasProperty('withAllAgents') || project.hasProperty('withAllKillMods')) {
                jvmArg "-javaagent:${flagDictionaryJarFile.get().asFile.absolutePath}${passiveCodeAgents ? '=passive' : ''}"
            }

            // 外部 Java エージェントの読み込み:
            // 1. -PextraAgent="パス/エージェント.jar"
            if (project.hasProperty('extraAgent')) {
                jvmArg "-javaagent:${file(project.property('extraAgent')).absolutePath}"
            }
            // 2. ./agents/ フォルダ内の全 jar を自動で -javaagent に追加
            def agentsDir = project.file('agents')
            if (agentsDir.exists()) {
                agentsDir.eachFileMatch(groovy.io.FileType.FILES, ~/.*\.jar$/) { agentJar ->
                    jvmArg "-javaagent:${agentJar.absolutePath}"
                }
            }
            // 3. ./libs/ 内の jar に Premain-Class / Agent-Class が含まれている場合、自動で -javaagent にも追加
            def libsDir = project.file('libs')
            if (libsDir.exists()) {
                libsDir.eachFileMatch(groovy.io.FileType.FILES, ~/.*\.jar$/) { modJar ->
                    try {
                        def zip = new java.util.zip.ZipFile(modJar)
                        def manifestEntry = zip.getEntry("META-INF/MANIFEST.MF")
                        if (manifestEntry != null) {
                            def manifest = new java.util.jar.Manifest(zip.getInputStream(manifestEntry))
                            def attrs = manifest.mainAttributes
                            if (attrs.getValue("Premain-Class") != null || attrs.getValue("Agent-Class") != null) {
                                jvmArg "-javaagent:${modJar.absolutePath}"
                            }
                        }
                        zip.close()
                    } catch (Exception ignored) {}
                }
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay')
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Mixin: refmap を生成して本番（SRG 難読化）環境でも注入先を解決できるようにする。
// config を指定すると各 run 構成に -mixin.config 引数が自動で付く。
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.test.mixins.json" // GameTest 用（架空の MOD が足すフィールドの再現）
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 配布環境の Minecraft の名前（SRG 名）→ 開発環境の名前（公式名）の表（2026-10-08）。配布環境では他 MOD のクラスが参照する Minecraft の
// フィールド・メソッドが SRG 名（f_146795_ 等）になり、公式名で書いた見分け（観察者の能力の地図・Tick の入口の犯人探し）が当たらない。
// 見分けに使うクラスのぶんだけ「SRG 名 公式名」を書き出し、MOD と観察者の jar に入れる（protect/McNames・observer/McNames が読む）
def mcNamesDir = layout.buildDirectory.dir('generated/mcnames')
def mcNamesOwners = [
        'net/minecraft/world/entity/Entity', 'net/minecraft/world/entity/LivingEntity', 'net/minecraft/world/entity/Mob',
        'net/minecraft/world/level/Level', 'net/minecraft/server/level/ServerLevel', 'net/minecraft/server/level/ServerChunkCache',
        'net/minecraft/server/level/ChunkMap', 'net/minecraft/server/level/ChunkMap$TrackedEntity',
        'net/minecraft/world/level/entity/EntityTickList', 'net/minecraft/world/level/entity/PersistentEntitySectionManager',
        'net/minecraft/world/level/entity/PersistentEntitySectionManager$Callback', 'net/minecraft/world/level/entity/TransientEntitySectionManager',
        'net/minecraft/world/level/entity/EntityLookup', 'net/minecraft/world/level/entity/EntitySectionStorage',
        'net/minecraft/world/level/entity/EntitySection']
def generateMcNames = tasks.register('generateMcNames') {
    group = 'build'
    description = 'Writes the SRG-to-official name table for the Minecraft classes the protection inspects'
    dependsOn 'createMcpToSrg'
    def tsrg = layout.buildDirectory.file('createMcpToSrg/output.tsrg')
    inputs.file tsrg
    inputs.property 'owners', mcNamesOwners
    outputs.dir mcNamesDir
    doLast {
        def owners = mcNamesOwners as Set
        def names = new TreeMap<String, String>()
        String owner = null
        tsrg.get().asFile.eachLine { line ->
            if (!line.startsWith('\t')) {
                owner = line.startsWith('tsrg2') ? null : line.split(' ')[0]
                return
            }
            if (line.startsWith('\t\t') || owner == null || !owners.contains(owner)) return
            def parts = line.trim().split(' ')
            def official = parts[0]
            def srg = parts[parts.length - 1]
            if (srg != official && (srg.startsWith('f_') || srg.startsWith('m_'))) names[srg] = official
        }
        def out = mcNamesDir.get().file('automata_valkyries_mcnames.txt').asFile
        out.parentFile.mkdirs()
        out.text = names.collect { k, v -> "${k} ${v}" }.join('\n') + '\n'
    }
}
sourceSets.main.resources { srcDir generateMcNames }
tasks.named('observerJar', Jar) { from generateMcNames }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    // 即死系 MOD との耐性検証用（-PwithKillMods のときだけ使う）
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    flatDir {
        dir 'libs'
        dir 'libs/bossmods'   // -PwithBossMods の Wither Storm と CrackersLib（tools/prepare_boss_mods.py が置く）
    }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // JEI のプラグイン（compat/jei）を書くための API。JEI 自体は入れない（-PwithJei / -PwithTechMods のときだけ実行時に読み込む）
    compileOnly fg.deobf("maven.modrinth:jei:15.62.0.217")
    // LifeGuard の呼び出し先（実行時はエージェントがブートストラップに置く。MOD の jar には入れない）
    compileOnly sourceSets.lifeguardhooks.output
    // オートマタヴァルキリー protect の呼び出し先（同じく実行時はエージェントがブートストラップに置く）
    compileOnly sourceSets.valkyrieprotecthooks.output

    // Mixin の refmap 生成用アノテーションプロセッサ
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // GeckoLib（エンティティの 3D モデル・アニメーション）
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    // ./libs/ フォルダ内の外部 jar を自動的に読み込み＆デオブフ（配置するだけでテスト可能）
    def libsDir = project.file('libs')
    if (libsDir.exists()) {
        libsDir.eachFileMatch(groovy.io.FileType.FILES, ~/.*\.jar$/) { modJar ->
            // fg.deobf(files(...)) はローカルの jar をデオブフしない（SRG 名のまま読まれ、Pig2 の Mixin が Entity のフィールドを見つけられず落ちた。2026-10-07）。
            // 名前-版.jar を flatDir の座標（libs:名前:版）にしてデオブフさせる。版の区切りが無い名前はそのまま読む
            def base = modJar.name - ~/\.jar$/
            def dash = base.lastIndexOf('-')
            if (dash > 0 && dash < base.length() - 1) {
                runtimeOnly fg.deobf("libs:${base.substring(0, dash)}:${base.substring(dash + 1)}")
            } else {
                runtimeOnly fg.deobf(files(modJar))
            }
        }
    }

    // Java エージェント同梱 MOD の一括読み込み（-PwithAllAgents）
    //   猫羽雫刀（nekohashizuku-blade: Javaエージェント同梱）+ Epic Core API（ECA: Javaエージェント同梱）+ 最後の剣
    if (project.hasProperty('withAllAgents')) {
        runtimeOnly fg.deobf("maven.modrinth:slashblade-resharped:1.9.65")
        runtimeOnly fg.deobf("maven.modrinth:annihilationblade:1.4.1")
        runtimeOnly fg.deobf("maven.modrinth:nekohashizuku-blade:3.7.0")
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")
        runtimeOnly fg.deobf("maven.modrinth:epic-core-api:1.1.8-fix")
        runtimeOnly fg.deobf("maven.modrinth:the-last-sword-you-never-forgot:1.1.1")
    }

    // 全ての即死・干渉・チート系検証 MOD の一括読み込み（-PwithAllKillMods）
    if (project.hasProperty('withAllKillMods')) {
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")
        runtimeOnly fg.deobf("curse.maven:hyperlink-1274604:7052766")
        runtimeOnly fg.deobf("curse.maven:the-trial-monolith-1462850:8561617")
        runtimeOnly fg.deobf("curse.maven:no-sugar-1476611:8000478")
        // -PwithoutOmniMobs: Omni-Mobs だけ外す（2026-10-05、爆発のたびに Husk を大量に作る問題の切り分け用）
        if (!project.hasProperty('withoutOmniMobs')) runtimeOnly fg.deobf("maven.modrinth:omni-mobs:0.3.5.3")
        runtimeOnly fg.deobf("maven.modrinth:imds-reborn:1.4.0")
        runtimeOnly fg.deobf("maven.modrinth:re-avaritia:1.20.1-1.4.2-release")
        runtimeOnly fg.deobf("maven.modrinth:more_avaritia:2.4")
        runtimeOnly fg.deobf("maven.modrinth:witherzilla:1.7")
        runtimeOnly fg.deobf("maven.modrinth:slashblade-resharped:1.9.65")
        runtimeOnly fg.deobf("maven.modrinth:annihilationblade:1.4.1")
        runtimeOnly fg.deobf("maven.modrinth:nekohashizuku-blade:3.7.0")
        // -PwithoutEca: ECA と、ECA を前提にする The Last Sword を外す（2026-10-22、ECA 抜きで Omni-Mobs の Flashfur が湧くかの切り分け用）
        if (!project.hasProperty('withoutEca')) {
            runtimeOnly fg.deobf("maven.modrinth:epic-core-api:1.1.8-fix")
            runtimeOnly fg.deobf("maven.modrinth:the-last-sword-you-never-forgot:1.1.1")
        }
        // -PwithoutManaita: ManaitaPlus Legacy・ManaitaMTK を外す（2026-10-23。まな板が getAttributeValue に割り込んで永続データを読み、
        // Omni-Mobs のボスがコンストラクタの途中で NullPointerException になって湧かない。Mixin はまな板のクラスに当たらなかった）
        if (!project.hasProperty('withoutManaita')) {
            runtimeOnly fg.deobf("maven.modrinth:manaitaplus-legacy:2.0.6.5")
            runtimeOnly fg.deobf("maven.modrinth:manaitamtk:1.7.4")
        }
        // Fantasy Ending は作業ディレクトリを変えないと起動できず、専用サーバーでも起動できないので -PwithFantasyEnding に分ける（併用可）
    }

    // 対策を書いていない（未知の）チート要素を持つ MOD の検証（-PwithCheatMods）。準汎用の層だけでどこまで効くかを見る
    //   ./gradlew runGameTestServer -PwithCheatMods -PgenericOnly
    //   ./gradlew runClient -PwithCheatMods
    if (project.hasProperty('withCheatMods')) {
        runtimeOnly fg.deobf("maven.modrinth:manaitaplus-legacy:2.0.6.5")        // ManaitaPlus Legacy 2.0.6.5（まな板。神装備・作業台の倍増）
        runtimeOnly fg.deobf("maven.modrinth:manaitamtk:1.7.4")                  // ManaitaMTK 1.7.4（まな板の作り直し版）
    }
    // 他の MOD のボスとタイムルーラーなどを戦わせる（-PwithBossMods、2026-10-20 ユーザー指定「他の MOD のボスと戦わせたい」。戦わせるのは宿命の結び糸 fate_thread）
    //   ./gradlew runClient -PwithBossMods
    if (project.hasProperty('withBossMods')) {
        runtimeOnly fg.deobf("curse.maven:titans-world-1392578:9046541")                         // Titans World 1.3（MCreator 製。巨大な怪物のタイタン）
        runtimeOnly fg.deobf("curse.maven:titans-api-1392566:7771996")                           // TitansAPI 2.0（Titans World の前提）
        runtimeOnly fg.deobf("maven.modrinth:attributefix:ihWybkI9")                             // AttributeFix 21.0.5（Titans World の前提）
        runtimeOnly fg.deobf("maven.modrinth:craziness-awakened-orespawn-remake:XJRIi1hU")       // Craziness Awakened 5.1.1（OreSpawn の後継）
        // Pehkui は Craziness Awakened の任意の前提（mandatory=false）。3.8.2 はこの開発環境では起動で落ちる（ForgeGradle が MC を組み直したラムダの引数の順と、
        // 互換 Mixin compat1204minus.ScreenHandlerMixin の @Local の順が合わない。2026-10-20）ので入れない
        // 2026-10-20 ユーザー指定「推奨の五つをいれて」で追加（DOOM The Titans は Java エージェント同梱なので -PwithDoomTitans に分けた）
        runtimeOnly fg.deobf("maven.modrinth:l_enders-cataclysm:C3H0azzB")                     // L_Ender's Cataclysm 3.31（Ignis・ハービンジャー・リヴァイアサン・ネザライトの怪物など）
        runtimeOnly fg.deobf("maven.modrinth:lionfish-api:CPftDBcY")                            // Lionfish-API 3.0（Cataclysm の前提）
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")                             // Curios API（Cataclysm・Terramity の前提）
        runtimeOnly fg.deobf("maven.modrinth:terramity:cjrb1wmA")                               // Terramity 0.9.8（Terraria 風のボス）
        runtimeOnly fg.deobf("maven.modrinth:caelus:mRry0DgY")                                  // Caelus API 3.2.0（Terramity の前提）
        runtimeOnly fg.deobf("maven.modrinth:patchouli:94dtOLgZ")                               // Patchouli 85（Terramity の前提）
        runtimeOnly fg.deobf("maven.modrinth:bosses-of-mass-destruction-forge:2Kw4xPhp")        // Bosses of Mass Destruction 1.1.2（ナイトリッチ・オブシディリス・ガントレット・ヴォイドブロッサム）
        runtimeOnly fg.deobf("maven.modrinth:cloth-config:t8TXrZvZ")                            // Cloth Config 11.1.136（BOMD の前提）
        runtimeOnly fg.deobf("maven.modrinth:cerbons-api:XWZQbKsr")                             // CERBON's API 1.1.0（BOMD の前提）
        // Cracker's Wither Storm Mod 4.2.1: 前提の CrackersLib を jar の中に入れて配っていて、入れ子はデオブフされないので、
        // tools/prepare_boss_mods.py で取り出した 2 つ（libs/bossmods）を読む
        if (project.file('libs/bossmods/witherstormmod-1.20.1-4.2.1.jar').exists()) {
            runtimeOnly fg.deobf("libs:witherstormmod-1.20.1:4.2.1")
            runtimeOnly fg.deobf("libs:crackerslib-forge-1.20.1:0.4.1")
        } else {
            logger.warn('[withBossMods] Wither Storm を読むには先に python tools/prepare_boss_mods.py を実行する')
        }
    }
    // 他の MOD のボスをさらに足す（-PwithMoreBossMods、2026-10-24 ユーザー指定「他のMODのボスと戦わせたいのでよさげなMODをダウンロードして」）。
    // -PwithBossMods と一緒にも使える。どれも Java エージェント・入れ子の jar を持たない（mods.toml と MANIFEST で確かめた）。前提は mods.toml の必須だけ
    //   ./gradlew runClient -PwithMoreBossMods
    if (project.hasProperty('withMoreBossMods')) {
        runtimeOnly fg.deobf("maven.modrinth:mowzies-mobs:acYEfsJa")                   // Mowzie's Mobs 1.8.2（フェロス・ラウトノート、フロストモー、ウムヴゥシ、彫刻家）
        runtimeOnly fg.deobf("maven.modrinth:aquamirae:rRfT3ynS")                      // Aquamirae 7.1.14（コーネリア船長、深淵の顎）
        runtimeOnly fg.deobf("maven.modrinth:fragmentum:T7QOSm4k")                     // Fragmentum 5.4.0（Aquamirae の前提）
        runtimeOnly fg.deobf("maven.modrinth:mutant-monsters:CUgYzMnF")                // Mutant Monsters 8.0.8（ミュータント・ゾンビ／スケルトン／クリーパー／エンダーマン）
        runtimeOnly fg.deobf("maven.modrinth:puzzles-lib:hOfDHA4g")                    // Puzzles Lib 8.1.36（Mutant Monsters の前提）
        runtimeOnly fg.deobf("maven.modrinth:borninchaos:8wmEhUSt")                    // Born in Chaos 1.7.5（パンプキンヘッドの君主、宣教師など）
        runtimeOnly fg.deobf("maven.modrinth:goety:jVPGt2qM")                          // Goety 2.5.59.2（アポストル、ヴィジエ、ウィザーの死霊術師など）
        runtimeOnly fg.deobf("maven.modrinth:irons-spells-n-spellbooks:hZaEegS9")      // Iron's Spells 'n Spellbooks 3.16.3（死せる王、炎の守護者など）
        runtimeOnly fg.deobf("maven.modrinth:irons-lib:6HqXQkgC")                      // Iron's Lib 1.20.1-2.2.0（Iron's Spells の前提）
        runtimeOnly fg.deobf("maven.modrinth:playeranimator:xe2EVE6q")                 // playerAnimator 1.0.2-rc1（Iron's Spells の前提）
        runtimeOnly fg.deobf("maven.modrinth:caelus:mRry0DgY")                         // Caelus API 3.2.0（Iron's Spells の前提。-PwithBossMods と同じ版）
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")                    // Curios API（Goety・Iron's Spells の前提。-PwithBossMods と同じ版）
    }
    // DOOM The Titans 5.0.0（中身は MOD ID transfinity_improved。1.7.10 の The Titans Mod の作り直しで、より強いタイタンと OP 装備）。
    // 自分で付く Java エージェント（runtime-agent: GodHelper・HealthGuard・EventBusFixer・HardenedThread など）を同梱し、実行中にクラスを書き換えるので、
    // 他のボス MOD と分けて -PwithDoomTitans で読む（2026-10-20）
    //   ./gradlew runClient -PwithDoomTitans
    if (project.hasProperty('withDoomTitans')) {
        runtimeOnly fg.deobf("maven.modrinth:doom-the-titans:u6A0rDMr")
    }
    //   ./gradlew runClient -PwithFantasyEnding   （クライアント専用: 専用サーバーではクライアントの設定を読んで起動に失敗する。
    //                                             Java エージェント agent-any を同梱し、LivingEntity を実行中に書き換える）
    //   作業ディレクトリの親に .gradle と build があると作者の開発環境とみなし、公式名で反射する（この環境ではそれで正しい）が、
    //   ログを作者の PC のパス E:\CollapsingWorld\System-e\uom\az.txt に書こうとする。そのフォルダが無いと起動できないので、
    //   E: が無い PC では `subst E: <任意のフォルダ>` で仮のドライブを作り、E:\CollapsingWorld\System-e\uom を作っておく（外すときは `subst E: /d`）。
    //   開発環境とみなされない場所（run/cheat 等）で動かすと難読化名で反射して失敗し、ワールドの読み込みが止まる。
    //   E: を用意しても、開発環境とみなすと自分自身の jar をエージェントとして attach して Instrumentation が取れず起動できない（2026-10-03）。
    //   つまりこの開発環境ではどちらの分岐でも動かない。
    //   通常のランチャー（Forge 47.4.23、C:\Users\sfdge\Games\automata-fe-test）でも、このMOD・エージェント抜きでも起動時に落ちる（2026-10-03）:
    //   FE の MShaderInstance が getUniform の結果を自前の MUniform に決め打ちで変換するが、MUniform を作るはずの parseUniformNode の上書きは
    //   vanilla で private なので呼ばれず、vanilla の Uniform のまま → ClassCastException。EndingLibrary 2.1.1 / 2.1.9 / 2.2.1fix、FE 2.7.18f も同じ作り
    if (project.hasProperty('withFantasyEnding')) {
        runtimeOnly fg.deobf("curse.maven:fantasy-ending-1420337:7642083")       // Fantasy Ending 2.7.20
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")              // Fantasy Ending の前提
        runtimeOnly fg.deobf("maven.modrinth:irons-spells-n-spellbooks:1.20.1-3.16.3") // Fantasy Ending の前提（Iron's Spells 'n Spellbooks）
        runtimeOnly fg.deobf("maven.modrinth:playeranimator:1.0.2-rc1+1.20-forge") // Iron's Spells の前提
        runtimeOnly fg.deobf("maven.modrinth:caelus:3.2.0+1.20.1")               // Iron's Spells の前提
        runtimeOnly fg.deobf("maven.modrinth:irons-lib:1.20.1-2.2.0")            // Iron's Spells の前提
        runtimeOnly fg.deobf("maven.modrinth:endinglibrary:2.1.1")             // Fantasy Ending の前提（EndingLibrary 2.1.1。mods.toml には書かれていない。2.1.9 だとシェーダーの作り方が合わず起動時に落ちる。FE 2.7.20 の公開直前の版）
    }

    // 即死系 MOD との耐性検証（開発時の実行環境だけ。配布 jar には入らない）
    //   ./gradlew runGameTestServer -PwithKillMods
    //   ./gradlew runClient -PwithKillMods -PwithImds   （IMDS は専用サーバーで起動できないのでクライアント専用）
    if (project.hasProperty('withKillMods') || project.hasProperty('withImds')) {
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")             // No-Sugar が実質必須
        runtimeOnly fg.deobf("curse.maven:hyperlink-1274604:7052766")           // Hyperlink 1201.2.4
        runtimeOnly fg.deobf("curse.maven:the-trial-monolith-1462850:8561617")  // The Trial Monolith 1.4.9
        runtimeOnly fg.deobf("curse.maven:no-sugar-1476611:8000478")            // No-Sugar 1.9.1
    }
    //   ./gradlew runClient -PwithOmniMobs   （Omni-Mobs の共通 Mixin がクライアントのクラスを参照するので、専用サーバーで起動できずクライアント専用）
    if (project.hasProperty('withOmniMobs')) {
        runtimeOnly fg.deobf("maven.modrinth:omni-mobs:0.3.5.3")                // Omni-Mobs 0.3.5.3
    }
    if (project.hasProperty('withImds')) {
        runtimeOnly fg.deobf("maven.modrinth:imds-reborn:1.4.0")                // IMDS Reborn 1.4.0
    }
    // 工業 MOD との連携の検証用（追加拡張仕様書 §11.1）。即死系の組み合わせとも同時に使える
    //   ./gradlew runGameTestServer -PwithTechMods   （CompatGameTests が Mekanism・AE2 を相手に動く。無いときは素通り）
    //   ./gradlew runClient -PwithTechMods
    if (project.hasProperty('withTechMods')) {
        runtimeOnly fg.deobf("maven.modrinth:mekanism:10.4.16.80")             // Mekanism 10.4.16
        runtimeOnly fg.deobf("maven.modrinth:ae2:15.4.11")                     // Applied Energistics 2 15.4.11
        runtimeOnly fg.deobf("maven.modrinth:guideme:20.1.15")                 // AE2 が必須
        runtimeOnly fg.deobf("maven.modrinth:jei:15.62.0.217")                 // タグ・レシピの手動確認用
    }
    // JEI だけ（レシピ・タグの手動確認用）: ./gradlew runClient -PwithJei
    if (project.hasProperty('withJei') && !project.hasProperty('withTechMods')) {
        runtimeOnly fg.deobf("maven.modrinth:jei:15.62.0.217")
    }
    // 追加の検証対象（上の組み合わせと同時にも使える）
    //   ./gradlew runGameTestServer -PwithKillMods2
    //   ./gradlew runClient -PwithKillMods2 -PwithWitherzilla   （Witherzilla は専用サーバーで起動できないのでクライアント専用）
    if (project.hasProperty('withKillMods2') || project.hasProperty('withWitherzilla')) {
        runtimeOnly fg.deobf("maven.modrinth:re-avaritia:1.20.1-1.4.2-release") // Re:Avaritia 1.4.2
        runtimeOnly fg.deobf("maven.modrinth:more_avaritia:2.4")                 // MoreAvaritia 2.4（Re:Avaritia が前提）
    }
    //   ./gradlew runClient -PwithSlashBlade   （SlashBlade 拡張の即死刀）
    if (project.hasProperty('withSlashBlade')) {
        runtimeOnly fg.deobf("maven.modrinth:slashblade-resharped:1.9.65")      // 前提: SlashBlade: Resharped
        runtimeOnly fg.deobf("maven.modrinth:annihilationblade:1.4.1")          // annihilationblade 1.4.1
        runtimeOnly fg.deobf("maven.modrinth:nekohashizuku-blade:3.7.0")        // Shizuku Blade 3.7.0（Java エージェント同梱）
    }
    //   ./gradlew runGameTestServer -PwithEca   （Epic Core API。Java エージェント同梱）
    //   ./gradlew runClient -PwithLastSword     （ECA を使う剣。専用サーバーで起動できないのでクライアント専用）
    if (project.hasProperty('withEca') || project.hasProperty('withLastSword')) {
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")
        runtimeOnly fg.deobf("maven.modrinth:epic-core-api:1.1.8-fix")          // Epic Core API 1.1.8-fix
    }
    if (project.hasProperty('withLastSword')) {
        runtimeOnly fg.deobf("maven.modrinth:the-last-sword-you-never-forgot:1.1.1") // The Last Sword You Never Forgot 1.1.1
    }
    if (project.hasProperty('withWitherzilla')) {
        runtimeOnly fg.deobf("maven.modrinth:witherzilla:1.7")                  // Witherzilla 1.7
    }
    // エージェントで他のエージェントに手を出す MOD の検証（2026-10-08、保護エージェントの対策づくり用）
    //   ./gradlew runClient -PwithSuperSteve -PwithObserver   （SuperSteve: 自分で attach し、JDK の InstrumentationImpl を書き換えて
    //                                                         他のエージェントの書き換えを捨てる。-Dsupersteve.safemode=true か MOD jzyy があるとしない）
    //   ./gradlew runClient -PwithMadness -PwithObserver      （Madness Entities: 本体のクラスを暗号化して隠し、Unsafe で定義する。コアMOD とエージェント同梱）
    // SuperSteve は自分の jar を読み直してクラスを作る。クラスパスに載ると jar の場所を取り違えて起動時に落ちる（2026-10-08）ので、
    // デオブフした物を run/mods に置いて MOD としてだけ読ませる（syncDevMods）
    if (project.hasProperty('withSuperSteve')) {
        devMods fg.deobf("maven.modrinth:supersteve:6.10.5pr")                   // SuperSteve 6.10.5pr
    }
    if (project.hasProperty('withMadness')) {
        devMods fg.deobf("maven.modrinth:madness_entities:MadnessEntities-1.20.1-3.3.1") // Madness Entities 3.3.1（隠したクラスを自分の jar から読み直すので run/mods に置く）
    }
    // ダメージの確かめ用の的（2026-10-04 ユーザー指定）: ./gradlew runClient -PwithDummy
    //   MmmMmmMmmMmm は refmap を持たず Mixin の注釈に SRG 名を直書きしているので、開発環境（公式名）ではそのままだと起動時に落ちる。
    //   SRG 名を公式名に置き換えた写し build/devmods/dummmmmmy-*-dev.jar を読み込む（無ければ置き換え前の物。作り方は docs の手順）
    if (project.hasProperty('withDummy')) {
        def devDummy = project.file('build/devmods/dummmmmmy-1.20-2.0.12-forge-dev.jar')
        if (devDummy.exists()) runtimeOnly fg.deobf(files(devDummy))
        else runtimeOnly fg.deobf("maven.modrinth:mmmmmmmmmmmm:1.20-2.0.12-forge")  // MmmMmmMmmMmm（ダミー人形）1.20-2.0.12
        runtimeOnly fg.deobf("maven.modrinth:moonlight:1.20-2.16.35-forge")    // Moonlight Lib（MmmMmmMmmMmm が必須）
    }
    // The Trial Monolith だけ（他の即死系 MOD 抜きで試す）: ./gradlew runClient -PwithTrialMonolith
    if (project.hasProperty('withTrialMonolith')) {
        runtimeOnly fg.deobf("curse.maven:the-trial-monolith-1462850:8561617")  // The Trial Monolith 1.4.9
    }

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, geckolib_version_range: geckolib_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    // 守る側のエージェント（と呼び出し先）を MOD の jar に入れる。設定 agents.*.enabled で、起動の引数なしに読み込む（protect/AgentSelfAttach。2026-10-09）。
    // タスクとして繋ぐと MixinGradle が jar ごとに足す addMixinsTo* の間で輪になるので、できたファイルを読むだけにし、順番だけ決める
    // （build / assemble はエージェントの jar も作る。開発環境では build/libs から直接読む）
    def agentFiles = project.ext.bundledAgents.collect {
        layout.buildDirectory.file("libs/${mod_id}-${it}.jar").get().asFile
    }
    mustRunAfter 'observerJar', 'lifeguardJar', 'lifeguardHooksJar', 'valkyrieProtectJar', 'valkyrieProtectHooksJar'
    from(agentFiles) {
        into 'META-INF/automata_valkyries/agents'
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json,${mod_id}.test.mixins.json"
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Extracts decompiled Minecraft + Forge sources (official mappings) and vanilla assets/data
// into .mcsrc/ so they can be grepped directly (by humans and AI tools). Run after the first build.
tasks.register('extractMcSources') {
    group = 'ai assist'
    description = 'Extracts Minecraft/Forge sources and vanilla assets to .mcsrc/ for reference'
    def fgCache = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle')
    def mapped = "${minecraft_version}-${forge_version}_mapped_${mapping_channel}_${mapping_version}"
    def sourcesJar = new File(fgCache, "minecraft_user_repo/net/minecraftforge/forge/${mapped}/forge-${mapped}-sources.jar")
    def extraJar = new File(fgCache, "minecraft_repo/versions/${minecraft_version}/client-extra.jar")
    def outDir = file('.mcsrc')
    doLast {
        if (!sourcesJar.exists()) throw new GradleException("Sources jar not found: ${sourcesJar}. Run './gradlew build' first.")
        project.delete(outDir)
        project.copy { from project.zipTree(sourcesJar); into new File(outDir, 'java') }
        if (extraJar.exists()) {
            project.copy { from project.zipTree(extraJar); include 'assets/**', 'data/**'; into outDir }
        }
        logger.lifecycle("Extracted to ${outDir}")
    }
}
