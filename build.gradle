plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 観察用・防御用の Java エージェント（src/observer, src/eprotectplus）。MOD とは別の jar にし、
// 起動オプション -javaagent で読ませる。Minecraft・Forge には依存しない（JDK だけ）
sourceSets {
    observer
    eprotectplus
}
def observerJarFile = layout.buildDirectory.file("libs/${mod_id}-observer.jar")
tasks.register('observerJar', Jar) {
    group = 'build'
    description = 'Builds the observation Java agent'
    from sourceSets.observer.output
    archiveFileName = "${mod_id}-observer.jar"
    manifest {
        attributes([
                'Premain-Class'          : 'com.automatavalkyries.observer.ObserverAgent',
                'Agent-Class'            : 'com.automatavalkyries.observer.ObserverAgent',
                'Can-Retransform-Classes': 'true',
                'Can-Redefine-Classes'   : 'false',
                'Implementation-Version' : mod_version
        ])
    }
}
def eprotectPlusJarFile = layout.buildDirectory.file("libs/${mod_id}-eprotect-plus.jar")
tasks.register('eprotectPlusJar', Jar) {
    group = 'build'
    description = 'Builds the Eprotect+ Java agent'
    from sourceSets.eprotectplus.output
    archiveFileName = "${mod_id}-eprotect-plus.jar"
    manifest {
        attributes([
                'Premain-Class'          : 'com.automatavalkyries.eprotectplus.EprotectPlusAgent',
                'Agent-Class'            : 'com.automatavalkyries.eprotectplus.EprotectPlusAgent',
                'Can-Retransform-Classes': 'true',
                'Can-Redefine-Classes'   : 'true',
                'Implementation-Version' : mod_version
        ])
    }
}
def flagDictionaryJarFile = layout.buildDirectory.file("libs/${mod_id}-flag-agent.jar")
tasks.register('flagDictionaryAgentJar', Jar) {
    group = 'build'
    description = 'Builds the Flag Dictionary protection Java agent'
    from sourceSets.eprotectplus.output
    archiveFileName = "${mod_id}-flag-agent.jar"
    manifest {
        attributes([
                'Premain-Class'          : 'com.automatavalkyries.eprotectplus.flag.FlagDictionaryAgent',
                'Agent-Class'            : 'com.automatavalkyries.eprotectplus.flag.FlagDictionaryAgent',
                'Can-Retransform-Classes': 'true',
                'Can-Redefine-Classes'   : 'true',
                'Implementation-Version' : mod_version
        ])
    }
}
tasks.named('assemble') {
    dependsOn 'observerJar'
    dependsOn 'eprotectPlusJar'
    dependsOn 'flagDictionaryAgentJar'
}
if (project.hasProperty('withObserver')) {
    tasks.matching { it.name.startsWith('prepareRun') || it.name in ['runClient', 'runServer', 'runGameTestServer'] }
            .configureEach { dependsOn 'observerJar' }
}
if (project.hasProperty('withEprotectPlus')) {
    tasks.matching { it.name.startsWith('prepareRun') || it.name in ['runClient', 'runServer', 'runGameTestServer'] }
            .configureEach { dependsOn 'eprotectPlusJar' }
}
if (project.hasProperty('withFlagAgent')) {
    tasks.matching { it.name.startsWith('prepareRun') || it.name in ['runClient', 'runServer', 'runGameTestServer'] }
            .configureEach { dependsOn 'flagDictionaryAgentJar' }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // -PgenericOnly（runGameTestServer / runClient）: MOD ごとの個別対策を切り、準汎用の層だけでどこまで守れるかを測る
            if (project.hasProperty('genericOnly')) property 'automata_valkyries.genericOnly', 'true'

            // -PdisableMixins=compat.HyperlinkMixins,...: このMODの Mixin を名前で外して起動する（干渉の切り分け用。mixin/AutomataMixinPlugin）
            if (project.hasProperty('disableMixins')) property 'automata_valkyries.disableMixins', project.property('disableMixins')

            // -PwithObserver: 観察用の Java エージェント（クラスの書き換えを見張るだけ）を付けて起動する
            if (project.hasProperty('withObserver')) jvmArg "-javaagent:${observerJarFile.get().asFile.absolutePath}"

            // -PwithEprotectPlus: Eprotect+ 高度防御・調査・迂回・真抹殺 Java エージェントを付けて起動する
            if (project.hasProperty('withEprotectPlus')) jvmArg "-javaagent:${eprotectPlusJarFile.get().asFile.absolutePath}"

            // -PwithFlagAgent: フラグ辞書防護 Java エージェントを付けて起動する
            if (project.hasProperty('withFlagAgent')) jvmArg "-javaagent:${flagDictionaryJarFile.get().asFile.absolutePath}"

            // 外部 Java エージェントの読み込み:
            // 1. -PextraAgent="パス/エージェント.jar"
            if (project.hasProperty('extraAgent')) {
                jvmArg "-javaagent:${file(project.property('extraAgent')).absolutePath}"
            }
            // 2. ./agents/ フォルダ内の全 jar を自動で -javaagent に追加
            def agentsDir = project.file('agents')
            if (agentsDir.exists()) {
                agentsDir.eachFileMatch(groovy.io.FileType.FILES, ~/.*\.jar$/) { agentJar ->
                    jvmArg "-javaagent:${agentJar.absolutePath}"
                }
            }
            // 3. ./libs/ 内の jar に Premain-Class / Agent-Class が含まれている場合、自動で -javaagent にも追加
            def libsDir = project.file('libs')
            if (libsDir.exists()) {
                libsDir.eachFileMatch(groovy.io.FileType.FILES, ~/.*\.jar$/) { modJar ->
                    try {
                        def zip = new java.util.zip.ZipFile(modJar)
                        def manifestEntry = zip.getEntry("META-INF/MANIFEST.MF")
                        if (manifestEntry != null) {
                            def manifest = new java.util.jar.Manifest(zip.getInputStream(manifestEntry))
                            def attrs = manifest.mainAttributes
                            if (attrs.getValue("Premain-Class") != null || attrs.getValue("Agent-Class") != null) {
                                jvmArg "-javaagent:${modJar.absolutePath}"
                            }
                        }
                        zip.close()
                    } catch (Exception ignored) {}
                }
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay')
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Mixin: refmap を生成して本番（SRG 難読化）環境でも注入先を解決できるようにする。
// config を指定すると各 run 構成に -mixin.config 引数が自動で付く。
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.test.mixins.json" // GameTest 用（架空の MOD が足すフィールドの再現）
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    // 即死系 MOD との耐性検証用（-PwithKillMods のときだけ使う）
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    flatDir {
        dir 'libs'
    }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // JEI のプラグイン（compat/jei）を書くための API。JEI 自体は入れない（-PwithJei / -PwithTechMods のときだけ実行時に読み込む）
    compileOnly fg.deobf("maven.modrinth:jei:15.62.0.217")

    // Mixin の refmap 生成用アノテーションプロセッサ
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // GeckoLib（エンティティの 3D モデル・アニメーション）
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    // ./libs/ フォルダ内の外部 jar を自動的に読み込み＆デオブフ（配置するだけでテスト可能）
    def libsDir = project.file('libs')
    if (libsDir.exists()) {
        libsDir.eachFileMatch(groovy.io.FileType.FILES, ~/.*\.jar$/) { modJar ->
            runtimeOnly fg.deobf(files(modJar))
        }
    }

    // Java エージェント同梱 MOD の一括読み込み（-PwithAllAgents）
    //   猫羽雫刀（nekohashizuku-blade: Javaエージェント同梱）+ Epic Core API（ECA: Javaエージェント同梱）+ 最後の剣
    if (project.hasProperty('withAllAgents')) {
        runtimeOnly fg.deobf("maven.modrinth:slashblade-resharped:1.9.65")
        runtimeOnly fg.deobf("maven.modrinth:annihilationblade:1.4.1")
        runtimeOnly fg.deobf("maven.modrinth:nekohashizuku-blade:3.7.0")
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")
        runtimeOnly fg.deobf("maven.modrinth:epic-core-api:1.1.8-fix")
        runtimeOnly fg.deobf("maven.modrinth:the-last-sword-you-never-forgot:1.1.1")
    }

    // 全ての即死・干渉・チート系検証 MOD の一括読み込み（-PwithAllKillMods）
    if (project.hasProperty('withAllKillMods')) {
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")
        runtimeOnly fg.deobf("curse.maven:hyperlink-1274604:7052766")
        runtimeOnly fg.deobf("curse.maven:the-trial-monolith-1462850:8561617")
        runtimeOnly fg.deobf("curse.maven:no-sugar-1476611:8000478")
        runtimeOnly fg.deobf("maven.modrinth:omni-mobs:0.3.5.3")
        runtimeOnly fg.deobf("maven.modrinth:imds-reborn:1.4.0")
        runtimeOnly fg.deobf("maven.modrinth:re-avaritia:1.20.1-1.4.2-release")
        runtimeOnly fg.deobf("maven.modrinth:more_avaritia:2.4")
        runtimeOnly fg.deobf("maven.modrinth:witherzilla:1.7")
        runtimeOnly fg.deobf("maven.modrinth:slashblade-resharped:1.9.65")
        runtimeOnly fg.deobf("maven.modrinth:annihilationblade:1.4.1")
        runtimeOnly fg.deobf("maven.modrinth:nekohashizuku-blade:3.7.0")
        runtimeOnly fg.deobf("maven.modrinth:epic-core-api:1.1.8-fix")
        runtimeOnly fg.deobf("maven.modrinth:the-last-sword-you-never-forgot:1.1.1")
    }

    // 即死系 MOD との耐性検証（開発時の実行環境だけ。配布 jar には入らない）
    //   ./gradlew runGameTestServer -PwithKillMods
    //   ./gradlew runClient -PwithKillMods -PwithImds   （IMDS は専用サーバーで起動できないのでクライアント専用）
    if (project.hasProperty('withKillMods') || project.hasProperty('withImds')) {
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")             // No-Sugar が実質必須
        runtimeOnly fg.deobf("curse.maven:hyperlink-1274604:7052766")           // Hyperlink 1201.2.4
        runtimeOnly fg.deobf("curse.maven:the-trial-monolith-1462850:8561617")  // The Trial Monolith 1.4.9
        runtimeOnly fg.deobf("curse.maven:no-sugar-1476611:8000478")            // No-Sugar 1.9.1
    }
    //   ./gradlew runClient -PwithOmniMobs   （Omni-Mobs の共通 Mixin がクライアントのクラスを参照するので、専用サーバーで起動できずクライアント専用）
    if (project.hasProperty('withOmniMobs')) {
        runtimeOnly fg.deobf("maven.modrinth:omni-mobs:0.3.5.3")                // Omni-Mobs 0.3.5.3
    }
    if (project.hasProperty('withImds')) {
        runtimeOnly fg.deobf("maven.modrinth:imds-reborn:1.4.0")                // IMDS Reborn 1.4.0
    }
    // 工業 MOD との連携の検証用（追加拡張仕様書 §11.1）。即死系の組み合わせとも同時に使える
    //   ./gradlew runGameTestServer -PwithTechMods   （CompatGameTests が Mekanism・AE2 を相手に動く。無いときは素通り）
    //   ./gradlew runClient -PwithTechMods
    if (project.hasProperty('withTechMods')) {
        runtimeOnly fg.deobf("maven.modrinth:mekanism:10.4.16.80")             // Mekanism 10.4.16
        runtimeOnly fg.deobf("maven.modrinth:ae2:15.4.11")                     // Applied Energistics 2 15.4.11
        runtimeOnly fg.deobf("maven.modrinth:guideme:20.1.15")                 // AE2 が必須
        runtimeOnly fg.deobf("maven.modrinth:jei:15.62.0.217")                 // タグ・レシピの手動確認用
    }
    // JEI だけ（レシピ・タグの手動確認用）: ./gradlew runClient -PwithJei
    if (project.hasProperty('withJei') && !project.hasProperty('withTechMods')) {
        runtimeOnly fg.deobf("maven.modrinth:jei:15.62.0.217")
    }
    // 追加の検証対象（上の組み合わせと同時にも使える）
    //   ./gradlew runGameTestServer -PwithKillMods2
    //   ./gradlew runClient -PwithKillMods2 -PwithWitherzilla   （Witherzilla は専用サーバーで起動できないのでクライアント専用）
    if (project.hasProperty('withKillMods2') || project.hasProperty('withWitherzilla')) {
        runtimeOnly fg.deobf("maven.modrinth:re-avaritia:1.20.1-1.4.2-release") // Re:Avaritia 1.4.2
        runtimeOnly fg.deobf("maven.modrinth:more_avaritia:2.4")                 // MoreAvaritia 2.4（Re:Avaritia が前提）
    }
    //   ./gradlew runClient -PwithSlashBlade   （SlashBlade 拡張の即死刀）
    if (project.hasProperty('withSlashBlade')) {
        runtimeOnly fg.deobf("maven.modrinth:slashblade-resharped:1.9.65")      // 前提: SlashBlade: Resharped
        runtimeOnly fg.deobf("maven.modrinth:annihilationblade:1.4.1")          // annihilationblade 1.4.1
        runtimeOnly fg.deobf("maven.modrinth:nekohashizuku-blade:3.7.0")        // Shizuku Blade 3.7.0（Java エージェント同梱）
    }
    //   ./gradlew runGameTestServer -PwithEca   （Epic Core API。Java エージェント同梱）
    //   ./gradlew runClient -PwithLastSword     （ECA を使う剣。専用サーバーで起動できないのでクライアント専用）
    if (project.hasProperty('withEca') || project.hasProperty('withLastSword')) {
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")
        runtimeOnly fg.deobf("maven.modrinth:epic-core-api:1.1.8-fix")          // Epic Core API 1.1.8-fix
    }
    if (project.hasProperty('withLastSword')) {
        runtimeOnly fg.deobf("maven.modrinth:the-last-sword-you-never-forgot:1.1.1") // The Last Sword You Never Forgot 1.1.1
    }
    if (project.hasProperty('withWitherzilla')) {
        runtimeOnly fg.deobf("maven.modrinth:witherzilla:1.7")                  // Witherzilla 1.7
    }

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, geckolib_version_range: geckolib_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json,${mod_id}.test.mixins.json"
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Extracts decompiled Minecraft + Forge sources (official mappings) and vanilla assets/data
// into .mcsrc/ so they can be grepped directly (by humans and AI tools). Run after the first build.
tasks.register('extractMcSources') {
    group = 'ai assist'
    description = 'Extracts Minecraft/Forge sources and vanilla assets to .mcsrc/ for reference'
    def fgCache = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle')
    def mapped = "${minecraft_version}-${forge_version}_mapped_${mapping_channel}_${mapping_version}"
    def sourcesJar = new File(fgCache, "minecraft_user_repo/net/minecraftforge/forge/${mapped}/forge-${mapped}-sources.jar")
    def extraJar = new File(fgCache, "minecraft_repo/versions/${minecraft_version}/client-extra.jar")
    def outDir = file('.mcsrc')
    doLast {
        if (!sourcesJar.exists()) throw new GradleException("Sources jar not found: ${sourcesJar}. Run './gradlew build' first.")
        project.delete(outDir)
        project.copy { from project.zipTree(sourcesJar); into new File(outDir, 'java') }
        if (extraJar.exists()) {
            project.copy { from project.zipTree(extraJar); include 'assets/**', 'data/**'; into outDir }
        }
        logger.lifecycle("Extracted to ${outDir}")
    }
}
